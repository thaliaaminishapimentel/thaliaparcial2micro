
# Configuracion de dependencias
# Proyecto FRDM-MCXA156
# Monitor de senal analogica con alarma

# Conversor analogico-digital
CONFIG_MCUX_COMPONENT_driver.lpadc=y

# Temporizador de hardware
CONFIG_MCUX_COMPONENT_driver.ctimer=y

# Entradas y salidas digitales
CONFIG_MCUX_COMPONENT_driver.gpio=y
CONFIG_MCUX_COMPONENT_driver.port=y

# Comunicacion serial UART
CONFIG_MCUX_COMPONENT_driver.lpuart=y

# Reinicio y configuracion de perifericos
CONFIG_MCUX_COMPONENT_driver.reset=y
CONFIG_MCUX_COMPONENT_driver.inputmux=y

# Configuracion manual de pines del proyecto
CONFIG_MCUX_HAS_PRJSEG_project.use_hw_app=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=n
CONFIG_MCUX_HAS_PRJSEG_module.board.pinmux_sel=n
